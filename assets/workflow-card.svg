<?xml version="1.0"?>
<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">How Sabrina works</title>
  <desc id="description">Idea, design, code, test, deploy, learn, and improve.</desc>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,.055)"/>
    </pattern>
    <radialGradient id="violetGlow" cx="8%" cy="10%" r="70%">
      <stop offset="0%" stop-color="oklch(65% 0.19 300)" stop-opacity=".18"/>
      <stop offset="100%" stop-color="oklch(65% 0.19 300)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="94%" cy="90%" r="70%">
      <stop offset="0%" stop-color="oklch(70% 0.15 220)" stop-opacity=".15"/>
      <stop offset="100%" stop-color="oklch(70% 0.15 220)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(65% 0.19 300)" stop-opacity=".7"/>
      <stop offset="50%" stop-color="rgba(255,255,255,.08)"/>
      <stop offset="100%" stop-color="oklch(70% 0.15 220)" stop-opacity=".65"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .step { font: 700 17px "JetBrains Mono", monospace; fill: rgba(255,255,255,.88); text-anchor: middle; }
      .arrow { font: 700 18px "JetBrains Mono", monospace; fill: oklch(70% 0.15 220); text-anchor: middle; }
      .comment { font: 600 17px "JetBrains Mono", monospace; fill: rgba(255,255,255,.58); }
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="#07070a"/>
  <rect width="1200" height="380" rx="24" fill="url(#dots)"/>
  <rect width="1200" height="380" rx="24" fill="url(#violetGlow)"/>
  <rect width="1200" height="380" rx="24" fill="url(#cyanGlow)"/>

  <rect x="42" y="28" width="1116" height="324" rx="16" fill="#101015" stroke="url(#border)" stroke-width="1.5"/>
  <path d="M42 80 H1158" stroke="rgba(255,255,255,.08)"/>

  <circle cx="72" cy="54" r="6" fill="#EC4899"/>
  <circle cx="94" cy="54" r="6" fill="#A855F7"/>
  <circle cx="116" cy="54" r="6" fill="#22D3EE"/>
  <text x="600" y="60" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" fill="rgba(255,255,255,.44)" text-anchor="middle">workflow.js</text>
  <text x="1128" y="60" font-family="JetBrains Mono, monospace" font-size="14" fill="oklch(70% 0.15 220)" text-anchor="end" filter="url(#glow)">JavaScript</text>

  <text x="78" y="126" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">
    <tspan fill="oklch(70% 0.15 220)">const</tspan>
    <tspan fill="rgba(255,255,255,.88)"> process </tspan>
    <tspan fill="rgba(255,255,255,.42)">=</tspan>
  </text>

  <g>
    <g><rect x="78" y="152" width="112" height="50" rx="12" fill="rgba(168,85,247,.10)" stroke="oklch(65% 0.19 300)"/><text class="step" x="134" y="183">idea</text></g>
    <text class="arrow" x="215" y="183">→</text>
    <g><rect x="240" y="152" width="112" height="50" rx="12" fill="rgba(34,211,238,.08)" stroke="oklch(70% 0.15 220)"/><text class="step" x="296" y="183">design</text></g>
    <text class="arrow" x="377" y="183">→</text>
    <g><rect x="402" y="152" width="112" height="50" rx="12" fill="rgba(168,85,247,.10)" stroke="oklch(65% 0.19 300)"/><text class="step" x="458" y="183">code</text></g>
    <text class="arrow" x="539" y="183">→</text>
    <g><rect x="564" y="152" width="112" height="50" rx="12" fill="rgba(34,211,238,.08)" stroke="oklch(70% 0.15 220)"/><text class="step" x="620" y="183">test</text></g>
    <text class="arrow" x="701" y="183">→</text>
    <g><rect x="726" y="152" width="112" height="50" rx="12" fill="rgba(168,85,247,.10)" stroke="oklch(65% 0.19 300)"/><text class="step" x="782" y="183">deploy</text></g>
    <text class="arrow" x="863" y="183">→</text>
    <g><rect x="888" y="152" width="112" height="50" rx="12" fill="rgba(34,211,238,.08)" stroke="oklch(70% 0.15 220)"/><text class="step" x="944" y="183">learn</text></g>
    <text class="arrow" x="1015" y="183">→</text>
    <g><rect x="1030" y="152" width="112" height="50" rx="12" fill="rgba(168,85,247,.10)" stroke="oklch(65% 0.19 300)"/><text class="step" x="1086" y="183">improve</text></g>
  </g>

  <text class="comment" x="78" y="258">// I enjoy creating solutions that balance a great user experience,</text>
  <text class="comment" x="78" y="292">// a solid technical foundation, and code that teams can easily maintain.</text>
  <circle cx="1128" cy="298" r="4" fill="oklch(70% 0.15 220)" filter="url(#glow)"/>
</svg>
